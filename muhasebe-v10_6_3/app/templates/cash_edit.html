{% extends "base.html" %}{% block title %}Kasa Düzenle{% endblock %}{% block content %}<div class="card" style="max-width:900px;margin:auto"><h1>Kasa Kaydı #{{data.id}}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="version" value="{{data.version}}"><div class="formgrid"><div><label>Tarih</label><input type="date" name="tarih" value="{{data.tx_date}}" required></div><div><label>PanCafe GENEL TOPLAM</label><div class="notice">{{'Otomatik bekliyor' if data.pancafe is none else ('%.2f'|format(data.pancafe)) ~ ' TL · otomatik'}}</div></div><div><label>Nakit</label><input type="number" step="0.01" name="nakit" value="{{data.nakit}}" min="0"></div><div><label>POS</label><input type="number" step="0.01" name="pos" value="{{data.pos}}" min="0"></div><div><label>IBAN</label><input type="number" step="0.01" name="iban" value="{{data.iban}}" min="0"></div><div><label>Hatalı</label><input type="number" step="0.01" name="hatali" value="{{data.hatali}}" min="0"></div><div><label>İndirim</label><input type="number" step="0.01" name="indirim" value="{{data.indirim}}" min="0"></div><div><label>Yeni Borç</label><input type="number" step="0.01" name="new_debt" value="{{data.new_debt}}" min="0"></div><div><label>Ödenen Eski Borç</label><input type="number" step="0.01" name="old_debt_paid" value="{{data.old_debt_paid}}" min="0"></div><div class="wide"><label>Açıklama</label><textarea name="aciklama">{{data.note}}</textarea></div><div class="wide"><button class="btn btn-primary">Güncelle</button> <a class="btn" href="/admin/cash">Vazgeç</a></div></div></form></div>{% endblock %}
