{% extends "base.html" %}{% block title %}Gider Düzenle{% endblock %}{% block content %}<div class="card" style="max-width:900px;margin:auto"><h1>Gider #{{data.id}}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="version" value="{{data.version}}"><div class="formgrid"><div><label>Tarih</label><input type="date" name="tarih" value="{{data.tx_date}}" required></div><div><label>Kategori</label><select name="kategori">{% for c in categories %}<option {% if c==data.category %}selected{% endif %}>{{c}}</option>{% endfor %}</select></div><div><label>Tutar</label><input type="number" step="0.01" min="0.01" name="tutar" value="{{data.amount}}" required></div><div><label>Ödeme Kaynağı</label><select name="odeme_kaynagi" id="eps" onchange="togE()"><option {% if data.payment_source=='İŞLETME' %}selected{% endif %}>İŞLETME</option><option {% if data.payment_source=='ŞAHSİ KART' %}selected{% endif %}>ŞAHSİ KART</option></select></div><div id="eow"><label>Kimin Kartı?</label><select name="kart_sahibi" id="eo"><option value="">Seçiniz</option>{% for x in card_owners %}<option {% if x==data.card_owner %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div><div class="wide"><label>Açıklama</label><textarea name="aciklama">{{data.note}}</textarea></div><div class="wide"><button class="btn btn-primary">Güncelle</button> <a class="btn" href="/admin/expenses">Vazgeç</a></div></div></form></div><script>function togE(){const y=document.getElementById('eps').value==='ŞAHSİ KART';document.getElementById('eow').style.display=y?'block':'none';document.getElementById('eo').required=y;if(!y)document.getElementById('eo').value=''}togE();</script>{% endblock %}
