{% extends "base.html" %}{% block title %}Ortak Düzenle{% endblock %}{% block content %}<div class="card" style="max-width:700px;margin:auto"><h1>Ortak #{{data.id}}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="version" value="{{data.version}}"><label>Ad</label><input name="name" value="{{data.name}}" required><label>Pay (%)</label><input type="number" step="0.01" min="0" max="100" name="share" value="{{data.share_percent}}" required><label>Not</label><textarea name="note">{{data.note}}</textarea><button class="btn btn-primary" style="margin-top:12px">Güncelle</button></form></div>{% endblock %}
