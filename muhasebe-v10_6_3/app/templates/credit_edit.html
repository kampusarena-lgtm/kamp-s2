{% extends "base.html" %}{% block title %}Veresiye Düzenle{% endblock %}{% block content %}<div class="card" style="max-width:800px;margin:auto"><h1>Veresiye #{{data.id}}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="version" value="{{data.version}}"><div class="formgrid"><div><label>Tarih</label><input type="date" name="tarih" value="{{data.tx_date}}" required></div><div><label>Kişi</label><input name="kisi" value="{{data.person}}" required></div><div><label>Tür</label><select name="tur" id="ect" onchange="togEC()"><option {% if data.movement_type=='BORÇ' %}selected{% endif %}>BORÇ</option><option {% if data.movement_type=='ÖDEME' %}selected{% endif %}>ÖDEME</option></select></div><div><label>Tutar</label><input type="number" step="0.01" name="tutar" value="{{data.amount}}" required min="0"></div><div id="ecmw"><label>Yöntem</label><select name="yontem" id="ecm"><option value="-">-</option><option {% if data.payment_method=='NAKİT' %}selected{% endif %}>NAKİT</option><option {% if data.payment_method=='POS' %}selected{% endif %}>POS</option><option {% if data.payment_method=='IBAN' %}selected{% endif %}>IBAN</option></select></div><div class="wide"><label>Açıklama</label><textarea name="aciklama">{{data.note}}</textarea></div><div class="wide"><button class="btn btn-primary">Güncelle</button></div></div></form></div><script>function togEC(){const y=document.getElementById('ect').value==='ÖDEME';document.getElementById('ecmw').style.display=y?'block':'none';document.getElementById('ecm').required=y;if(!y)document.getElementById('ecm').value='-'}togEC();</script>{% endblock %}
